; MIR-AI server configuration template
; Copy this file to config.ini on the server and populate secrets locally.
; DO NOT commit config.ini or real credentials to Git.

[POSTGRES]
host =
port = 5432
user =
password =
database = regulatory
schema = mirai_uat_100
folder = regulatory
log = regulatory.log

[PATHS]
; Main source switch: nas or s3
source_type = s3

; Used when source_type=nas. All nested folders are included when
; [MIR_AI] source_recursive=true.
docs_root =

; Legacy setting retained for main.py compatibility.
supported_extensions = .pdf,.docx
log_dir = logs

[GCP]
gcp_key_path =

[s3]
; Existing S3 configuration pattern is supported unchanged.
access_key_id =
secret_access_key =
bucket =
prefix =
region = us-east-1
profile =
session_token =
temp_dir = C:\Temp\epod_downloads

; Optional additions; leave blank/default if not used.
endpoint_url =
scratch_reserve_mb = 2048

[AZURE_OPENAI_EMBEDDING]
api_base =
api_version = 2025-04-01-preview
deployment =
model = text-embedding-3-large
api_key =

[AZURE_OPENAI_CHAT]
api_base =
api_version =
deployment = gpt-4o
model = gpt-4o
api_key =

; Legacy sections can remain in the same config.ini for main.py compatibility.
[CHUNKING]
chunk_target_chars = 4000
chunk_overlap_chars = 400
chunk_max_chars = 24000
chunk_min_chars = 150
section_min_chars = 200
max_pages_per_group = 10

[EMBEDDING]
embedding_dim = 3072
embedding_batch_size = 16
embedding_max_tokens = 6000

[OCR]
ocr_render_dpi = 200
scanned_page_text_threshold = 100

[PIPELINE]
page_workers = 4
api_max_retries = 3
api_retry_delay_s = 5
max_doc_retries = 3
enable_embeddings = false

[LOGGING]
log_max_bytes = 10485760
log_backup_count = 5

[MIR_AI]
; ----------------------------------------------------------------------
; CONFIG-DRIVEN SOURCE CONTROL
; ----------------------------------------------------------------------

; Safety switch. When false, running mir_ai_main.py without --file/--root/--s3
; fails instead of starting a broad ingestion accidentally.
source_auto_run = false

; Include subfolders / nested S3 keys under the configured root/prefix.
source_recursive = true

; 0 = unlimited. Useful for 1/10/100 document qualification runs.
source_max_files = 0

; ----------------------------------------------------------------------
; STRUCTURED METADATA POLICY
; ----------------------------------------------------------------------
;
; required = authoritative RimDocs input is mandatory and the RimDocs-first
;            50-field metadata workflow runs. Use this for formal MIR-AI
;            requirements qualification and production flows that require it.
;
; optional = if RimDocs input is configured, run the RimDocs-first metadata
;            workflow. If no RimDocs input is configured, continue ingestion
;            and SKIP structured metadata extraction instead of treating every
;            field as missing.
;
; disabled = never run the structured metadata stage. Useful for parsing,
;            OCR, table, chunking, embedding, or infrastructure-only tests.
metadata_mode = optional

; Optional RimDocs JSONL handover. CLI --rimdocs-jsonl overrides it.
; This path is required only when metadata_mode=required.
rimdocs_jsonl_path =

; ----------------------------------------------------------------------
; RESOURCE CONTROL
; ----------------------------------------------------------------------
page_workers = 4
max_inflight_pages = 8
doc_workers = 2
max_inflight_docs = 4

vision_concurrency = 16
chat_concurrency = 6
embedding_concurrency = 8

lease_seconds = 900
heartbeat_seconds = 60

ocr_render_dpi = 200
scanned_text_threshold = 100

embedding_model = text-embedding-3-large
embedding_dim = 3072
embedding_api_version = 2025-04-01-preview
embedding_batch_size = 16

chunk_target_min_tokens = 1200
chunk_target_max_tokens = 1500
chunk_overlap_tokens = 100
table_summary_workers = 4

vector_index_mode = exact
enable_embeddings = true
scratch_dir = C:\Temp\mirai_scratch
log_level = INFO

; ----------------------------------------------------------------------
; FORMAT POLICY
; ----------------------------------------------------------------------

; Turn formats on/off independently.
enable_pdf = true
enable_docx = true

; When both physical representations exist for one logical document.
preferred_format = pdf

; ----------------------------------------------------------------------
; SOURCE SELECTION MODE
; ----------------------------------------------------------------------

; false = process all eligible discovered logical documents below the
; configured NAS root / S3 prefix.
;
; true = process only extensionless logical IDs from the control table.
object_list_enabled = false

; Used only when object_list_enabled=true.
object_list_schema = regulatory
object_list_table = mirai_obj_list
object_list_id_column =

; Never arbitrarily choose between duplicate physical candidates.
strict_source_selection = true

; false is usually appropriate for Windows NAS and business object IDs.
object_match_case_sensitive = false
