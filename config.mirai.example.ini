; MIR-AI server configuration template
; Copy to config.ini on the server and populate secrets locally.
; config.ini is gitignored. DO NOT commit credentials.

[POSTGRES]
host =
port = 5432
user =
password =
database = regulatory
schema = mirai_uat_100
folder = regulatory

[PATHS]
; nas | s3
source_type = s3
docs_root =
supported_extensions = .pdf,.docx
log_dir = logs

[GCP]
gcp_key_path =

[s3]
; Existing server pattern is preserved.
access_key_id =
secret_access_key =
bucket =
prefix =
region = us-east-1
profile =
session_token =
temp_dir = C:\Temp\epod_downloads
endpoint_url =
scratch_reserve_mb = 2048
; SDK resilience; optional overrides.
max_attempts = 10
connect_timeout_s = 20
read_timeout_s = 120

[AZURE_OPENAI_EMBEDDING]
api_base =
api_version = 2025-04-01-preview
deployment =
model = text-embedding-3-large
api_key =
; Enterprise gateway compatibility. Keep defaults unless the gateway contract says otherwise.
url_template = {endpoint}/openai/deployments/{deployment}/{path}?api-version={api_version}
send_model = true
send_dimensions = false

[AZURE_OPENAI_CHAT]
api_base =
api_version =
deployment = gpt-4o
model = gpt-4o
api_key =
url_template = {endpoint}/openai/deployments/{deployment}/{path}?api-version={api_version}
send_model = true
send_dimensions = false

[LOGGING]
log_max_bytes = 52428800
log_backup_count = 10
log_queue_size = 10000
log_console = true
log_console_json = false

[MIR_AI]
; ---------- execution / source ----------
source_auto_run = false
source_recursive = true
source_max_files = 0
source_plan_only = false

; false = require an authorized one-time --init-db; true = idempotent schema init on startup.
auto_init_db = false

; required | optional | disabled
metadata_mode = optional
rimdocs_jsonl_path =

; all-files mode when false; authoritative control-table mode when true.
object_list_enabled = false
object_list_schema = regulatory
object_list_table = mirai_obj_list
object_list_id_column =
strict_source_selection = true
object_match_case_sensitive = false

enable_pdf = true
enable_docx = true
preferred_format = pdf

; ---------- bounded concurrency ----------
page_workers = 4
max_inflight_pages = 8
doc_workers = 2
max_inflight_docs = 4
vision_concurrency = 16
chat_concurrency = 6
embedding_concurrency = 8

; ---------- lease / resume ----------
lease_seconds = 900
heartbeat_seconds = 60
generation_max_attempts = 5
progress_log_every_pages = 25

; ---------- document-level retry ----------
batch_continue_on_error = true
batch_retry_transient_errors = true
batch_retry_attempts = 2
batch_retry_base_seconds = 2
batch_exit_nonzero_on_error = true

; ---------- PostgreSQL resilience ----------
; 0 = derive pool size from configured worker concurrency.
db_pool_maxconn = 0
db_max_retries = 5
db_retry_base_seconds = 1
db_connect_timeout_s = 15
db_keepalives_idle_s = 30
db_keepalives_interval_s = 10
db_keepalives_count = 5

; ---------- external API resilience ----------
api_max_retries = 5
api_retry_base_seconds = 1
api_timeout_s = 120

; Preflight prevents a broad batch from starting when a required dependency/config is already broken.
preflight_enabled = true
preflight_embedding = true
preflight_chat = true
; Vision preflight validates local client/credential initialization; it does not send document content.
preflight_vision = true

; ---------- extraction ----------
ocr_render_dpi = 200
scanned_text_threshold = 100

; strict = fail closed if MIR-AI required embedding settings differ.
; warn = compatibility diagnosis only; never treat such runs as requirement-qualified.
requirements_mode = strict
embedding_model = text-embedding-3-large
embedding_dim = 3072
embedding_api_version = 2025-04-01-preview
embedding_batch_size = 16

chunk_target_min_tokens = 1200
chunk_target_max_tokens = 1500
chunk_overlap_tokens = 100
table_summary_workers = 4
vector_index_mode = exact
enable_embeddings = true
scratch_dir = C:\Temp\mirai_scratch
log_level = INFO
