name: Rich document extraction and translation validation

on:
  push:
    branches: [feat/rich-document-multilingual-v2]
  pull_request:
    paths:
      - rich_document.py
      - translation_stage.py
      - pdf_processor.py
      - page_stage.py
      - extracted_source.py
      - processing_profile.py
      - tests/test_rich_document.py
      - tests/stress_rich_document.py
      - .github/workflows/rich-document-tests.yml
  workflow_dispatch:
    inputs:
      documents:
        description: Number of synthetic PDFs
        required: false
        default: '100'
      pages_per_doc:
        description: Pages per synthetic PDF
        required: false
        default: '12'

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "PyMuPDF>=1.24,<2" "pdfplumber>=0.11,<1" "pillow>=10,<13" "PyYAML>=6,<7" "psycopg2-binary>=2.9,<3"
      - name: CI-only local config
        run: |
          cat > config.ini <<'EOF'
          [POSTGRES]
          host=localhost
          port=5432
          database=embedding_test
          user=postgres
          password=test
          schema=intake_ci
          folder=ci
          [GCP]
          gcp_key_path=not-used.json
          EOF
      - run: python -m py_compile rich_document.py translation_stage.py pdf_processor.py page_stage.py extracted_source.py processing_profile.py
      - run: python -m unittest discover -s tests -p test_rich_document.py -v

  synthetic-stress:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "PyMuPDF>=1.24,<2" "pdfplumber>=0.11,<1" "pillow>=10,<13" "PyYAML>=6,<7"
      - name: CI-only local config
        run: |
          cat > config.ini <<'EOF'
          [POSTGRES]
          host=localhost
          port=5432
          database=embedding_test
          user=postgres
          password=test
          schema=intake_ci
          folder=ci
          [GCP]
          gcp_key_path=not-used.json
          EOF
      - name: Run synthetic mixed-content stress
        env:
          STRESS_DOCUMENTS: ${{ inputs.documents }}
          STRESS_PAGES: ${{ inputs.pages_per_doc }}
        run: |
          python tests/stress_rich_document.py --documents "$STRESS_DOCUMENTS" --pages-per-doc "$STRESS_PAGES" --workers 8
