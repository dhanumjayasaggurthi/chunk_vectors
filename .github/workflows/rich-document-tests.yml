name: Rich document extraction and translation validation

on:
  push:
    branches: [feat/rich-document-multilingual-v2, feat/regulatory-capture-qualification]
  pull_request:
    paths:
      - rich_document.py
      - translation_stage.py
      - pdf_processor.py
      - page_stage.py
      - extracted_source.py
      - processing_profile.py
      - tests/test_rich_document.py
      - figure_recovery.py
      - visual_evidence.py
      - docx_evidence.py
      - retention_batch.py
      - production.py
      - config.ini.example
      - profiles/deployment_policy.example.yml
      - profiles/visual_evidence_native.example.json
      - tests/test_production.py
      - resource_guard.py
      - profiles/retention_batch_linux_8core_30gb.example.json
      - profiles/regulatory_metadata_api.example.yml
      - tests/test_retention_batch.py
      - profiles/retention_batch_example.json
      - reuse_materialize.py
      - tests/test_reuse_materialize.py
      - tests/test_docx_evidence.py
      - tests/public_docx_evidence_benchmark.py
      - tests/public_docx_evidence_sources.json
      - profiles/docx_evidence_example.json
      - visual_enrichment.py
      - azure_client.py
      - tests/test_visual_enrichment.py
      - profiles/visual_enrichment_example.json
      - profiles/visual_enrichment_execution_example.json
      - tests/public_visual_evidence_benchmark.py
      - tests/public_visual_evidence_sources.json
      - profiles/visual_evidence_example.json
      - source_evidence_archive.py
      - tests/test_source_evidence_archive.py
      - tests/test_deferred_visual_native.py
      - tests/test_empty_table_deferred.py
      - deferred_ocr.py
      - tests/test_deferred_ocr.py
      - db.py
      - db_pool.py
      - config.py
      - configurable_chunking.py
      - semantic_chunking_v2.py
      - table_continuity.py
      - metadata_extractor.py
      - tests/test_db_pool.py
      - tests/test_semantic_chunking_v2.py
      - tests/test_materialization_quality_summary.py
      - tests/test_native_process_workers.py
      - profiles/regulatory_semantic_v2_example.yml
      - tests/test_figure_recovery.py
      - logger.py
      - tests/test_logger_encoding.py
      - table_extractor.py
      - tests/test_table_source_fidelity.py
      - tests/stress_rich_document.py
      - tests/test_online_regulatory_benchmark.py
      - tests/test_translation_stage.py
      - tests/test_public_corpus_aggregation.py
      - approved_images.py
      - tests/test_approved_images.py
      - tests/online_public_regulatory_benchmark.py
      - .github/workflows/rich-document-tests.yml
  workflow_dispatch:
    inputs:
      documents:
        description: Number of synthetic PDFs
        required: false
        default: '100'
      pages_per_doc:
        description: Pages per synthetic PDF
        required: false
        default: '12'

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "PyMuPDF>=1.24,<2" "pdfplumber>=0.11,<1" "pillow>=10,<13" "PyYAML>=6,<7" "psycopg2-binary>=2.9,<3" "tiktoken>=0.7,<1" "requests>=2.32,<3"
      - name: CI-only local config
        run: |
          cat > config.ini <<'EOF'
          [POSTGRES]
          host=localhost
          port=5432
          database=embedding_test
          user=postgres
          password=test
          schema=intake_ci
          folder=ci
          [GCP]
          gcp_key_path=not-used.json
          EOF
      - run: python -m py_compile rich_document.py translation_stage.py pdf_processor.py page_stage.py extracted_source.py processing_profile.py figure_recovery.py source_evidence_archive.py logger.py
      - run: python -m py_compile db.py db_pool.py configurable_chunking.py semantic_chunking_v2.py table_continuity.py metadata_extractor.py
      - run: python -m unittest discover -s tests -p test_rich_document.py -v
      - run: python -m unittest discover -s tests -p test_figure_recovery.py -v
      - run: python -m unittest discover -s tests -p test_visual_enrichment.py -v
      - run: python -m unittest discover -s tests -p test_docx_evidence.py -v
      - run: python -m unittest discover -s tests -p test_retention_batch.py -v
      - run: python -m unittest discover -s tests -p test_production.py -v
      - run: python -m unittest discover -s tests -p test_source_evidence_archive.py -v
      - run: python -m unittest discover -s tests -p test_deferred_visual_native.py -v
      - run: python -m unittest discover -s tests -p test_empty_table_deferred.py -v
      - run: python -m unittest discover -s tests -p test_deferred_ocr.py -v
      - run: python -m unittest discover -s tests -p test_semantic_chunking_v2.py -v
      - run: python -m unittest discover -s tests -p test_materialization_quality_summary.py -v
      - run: python -m unittest discover -s tests -p test_db_pool.py -v
      - run: python -m unittest discover -s tests -p test_native_process_workers.py -v
      - run: python -m unittest discover -s tests -p test_logger_encoding.py -v
      - run: python -m unittest discover -s tests -p test_table_source_fidelity.py -v
      - run: python -m unittest discover -s tests -p test_approved_images.py -v
      - run: python -m unittest discover -s tests -p test_translation_stage.py -v
      - run: python -m unittest discover -s tests -p test_public_corpus_aggregation.py -v
      - run: python -m unittest discover -s tests -p test_online_regulatory_benchmark.py -v
      - name: Run 100 mixed-content synthetic PDF smoke test
        run: python tests/stress_rich_document.py --documents 100 --pages-per-doc 12 --workers 8

  windows-visual-evidence:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install "PyMuPDF>=1.24,<2" "pdfplumber>=0.11,<1" "pillow>=10,<13" "PyYAML>=6,<7" "psycopg2-binary>=2.9,<3" "tiktoken>=0.7,<1" "requests>=2.32,<3"
      - name: CI-only local config
        shell: bash
        run: |
          cat > config.ini <<'EOF'
          [POSTGRES]
          host=localhost
          port=5432
          database=embedding_test
          user=postgres
          password=test
          schema=intake_ci
          folder=ci
          [GCP]
          gcp_key_path=not-used.json
          EOF
      - run: python -m unittest discover -s tests -p test_figure_recovery.py -v
      - run: python -m unittest discover -s tests -p test_visual_enrichment.py -v
      - run: python -m unittest discover -s tests -p test_docx_evidence.py -v
      - run: python -m unittest discover -s tests -p test_retention_batch.py -v
      - run: python -m unittest discover -s tests -p test_production.py -v

  public-visual-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "PyMuPDF==1.28.2" "pdfplumber==0.11.10" "pdfminer.six==20260107" "pillow>=10,<13" "requests>=2.32,<3" "tiktoken>=0.7,<1" "PyYAML>=6,<7"
      - name: CI-only local config
        run: |
          cat > config.ini <<'EOF'
          [POSTGRES]
          host=localhost
          port=5432
          database=embedding_test
          user=postgres
          password=test
          schema=intake_ci
          folder=ci
          [GCP]
          gcp_key_path=not-used.json
          EOF
      - run: python tests/public_visual_evidence_benchmark.py tests/public_visual_evidence_sources.json public_visual_report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-visual-evidence-report
          path: public_visual_report.json
          if-no-files-found: error

  public-docx-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "requests>=2.32,<3" "tiktoken>=0.7,<1"
      - run: python tests/public_docx_evidence_benchmark.py tests/public_docx_evidence_sources.json profiles/docx_evidence_example.json public_docx_report.json
      - uses: actions/upload-artifact@v4
        with:
          name: public-docx-evidence-report
          path: public_docx_report.json

  synthetic-stress:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "PyMuPDF>=1.24,<2" "pdfplumber>=0.11,<1" "pillow>=10,<13" "PyYAML>=6,<7"
      - name: CI-only local config
        run: |
          cat > config.ini <<'EOF'
          [POSTGRES]
          host=localhost
          port=5432
          database=embedding_test
          user=postgres
          password=test
          schema=intake_ci
          folder=ci
          [GCP]
          gcp_key_path=not-used.json
          EOF
      - name: Run synthetic mixed-content stress
        env:
          STRESS_DOCUMENTS: ${{ inputs.documents }}
          STRESS_PAGES: ${{ inputs.pages_per_doc }}
        run: |
          python tests/stress_rich_document.py --documents "$STRESS_DOCUMENTS" --pages-per-doc "$STRESS_PAGES" --workers 8
