name: Open-grid physical table body regression
on:
  push:
    branches: [feat/rich-document-multilingual-v2, feat/regulatory-capture-qualification]
    paths:
      - open_grid_recovery.py
      - extracted_source.py
      - metadata_extractor.py
      - reuse_materialize.py
      - semantic_chunking_v2.py
      - tests/test_open_grid_recovery.py
      - tests/full_open_grid_benchmark.py
      - tests/public_giant_materialization_benchmark.py
      - .github/workflows/open-grid-recovery.yml
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: embedding_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d embedding_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: test
      PGDATABASE: embedding_test
      INGESTION_REUSE_TEST_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "PyMuPDF==1.28.2" "pdfplumber==0.11.10" "pdfminer.six==20260107" "pillow>=10,<13" "psycopg2-binary>=2.9,<3" "tiktoken>=0.7,<1" "requests>=2.32,<3" "PyYAML>=6,<7"
      - name: CI-only config
        run: |
          cat > config.ini <<'EOF'
          [POSTGRES]
          host=localhost
          port=5432
          database=embedding_test
          user=postgres
          password=test
          schema=intake_ci
          folder=ci
          pool_enabled=true
          pool_min_connections=1
          pool_max_connections=4
          [GCP]
          gcp_key_path=not-used.json
          EOF
      - run: python -m unittest discover -s tests -p test_open_grid_recovery.py -v
      - name: Acquire the pinned public USITC original
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 360 --max-filesize 140000000 \
            https://learning.usitc.gov/hts-docs/documents/finalCopy.pdf --output public-hts.pdf
          sha256sum --check <<'EOF'
          e52e377f0234c60d5c98947129040a0706958438377868abddeff876cbf56068  public-hts.pdf
          EOF
      - name: Verify strict native rows for all 4496 physical pages
        run: |
          python tests/full_open_grid_benchmark.py --pdf "$RUNNER_TEMP/public-hts.pdf" \
            --workers 4 --native-rows --report hts_native_rows.json
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('hts_native_rows.json').read_text(encoding='utf-8'))
          assert result['pages'] == 4496
          assert result['counts'] == {'BODY_IN_ROW': 2084, 'NO_BODY_IN_ROW': 2412}
          assert result['physical_lines'] == 81941
          assert result['nonspace_characters'] == 3584452
          assert 0 < result['bodies_with_native_spacing'] <= 2084
          assert result['logical_rows_verified'] is False
          PY
      - name: Publish and replay the same 4496-page source with bounded batches
        run: |
          python tests/public_giant_materialization_benchmark.py \
            --pdf "$RUNNER_TEMP/public-hts.pdf" --report hts_materialization.json \
            --source-batch-rows 128 --write-batch-rows 200
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hts-native-rows-${{ github.run_id }}
          path: |
            hts_native_rows.json
            hts_materialization.json
          if-no-files-found: warn
          retention-days: 14
