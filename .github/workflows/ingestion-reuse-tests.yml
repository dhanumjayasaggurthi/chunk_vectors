name: Main ingestion reuse and performance tests

on:
  push:
    branches: [feat/main-ingestion-reuse-performance]
  pull_request:
    paths:
      - main.py
      - extracted_source.py
      - configurable_chunking.py
      - metadata_extractor.py
      - processing_profile.py
      - reuse_materialize.py
      - profiles/intake_reuse_immbot_example.yml
      - tests/test_reuse_materialize.py
      - tests/test_ingestion_hotpath.py
      - tests/test_ocr_batch.py
      - tests/test_ocr_quota.py
      - tests/test_page_stage.py
      - visual_task_ledger.py
      - figure_recovery.py
      - tests/test_visual_task_ledger.py
      - page_stage.py
      - ocr_quota.py
      - pdf_processor.py
      - vision_ocr.py
      - profiles/regulatory_page_stage_example.yml
      - .github/workflows/ingestion-reuse-tests.yml
      - translation_stage.py
      - tests/test_translation_stage.py

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install only the test dependencies
        run: python -m pip install "psycopg2-binary>=2.9,<3" "tiktoken>=0.7,<1" "PyYAML>=6.0.2,<7" "PyMuPDF>=1.24,<2" "pdfplumber>=0.11,<1"
      - name: Create placeholder local config (no real credentials)
        shell: bash
        run: |
          cat > config.ini <<'EOF'
          [POSTGRES]
          host=localhost
          port=5432
          database=embedding_test
          user=postgres
          password=test
          schema=intake_ci
          folder=ci
          [GCP]
          gcp_key_path=not-used.json
          EOF
      - name: Compile modified modules
        run: python -m py_compile main.py extracted_source.py configurable_chunking.py metadata_extractor.py processing_profile.py reuse_materialize.py page_stage.py ocr_quota.py vision_ocr.py pdf_processor.py
      - name: Run intake reuse unit tests
        run: python -m unittest discover -s tests -p 'test_*materialize.py' -v
      - name: Test one-pass PDF hotpath and metadata integrity
        run: python -m unittest discover -s tests -p 'test_ingestion_hotpath.py' -v
      - name: Test cloud-free OCR batch semantics
        run: python -m unittest discover -s tests -p 'test_ocr_batch.py' -v
      - name: Check shared OCR quota project identity
        run: python -m unittest discover -s tests -p 'test_ocr_quota.py' -v
      - name: Test stage config and bounded batching
        run: python -m unittest discover -s tests -p 'test_page_stage.py' -v

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: embedding_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d embedding_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: test
      PGDATABASE: embedding_test
      INGESTION_REUSE_TEST_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install "psycopg2-binary>=2.9,<3" "tiktoken>=0.7,<1" "PyYAML>=6.0.2,<7" "PyMuPDF>=1.24,<2" "pdfplumber>=0.11,<1"
      - name: Configure local CI-only database access
        run: |
          cat > config.ini <<'EOF'
          [POSTGRES]
          host=localhost
          port=5432
          database=embedding_test
          user=postgres
          password=test
          schema=intake_ci
          folder=ci
          [GCP]
          gcp_key_path=not-used.json
          EOF
      - name: Run real PostgreSQL transactional and recovery tests
        run: python -m unittest discover -s tests -p 'test_reuse_materialize.py' -v
      - name: Test bounded PDF staging, resume and full rechunk handoff
        run: python -m unittest discover -s tests -p 'test_page_stage.py' -v
      - name: Test cross-worker shared quota accounting and 429 cooldown
        run: python -m unittest discover -s tests -p 'test_ocr_quota.py' -v
      - name: Verify durable translation leases and retry backoff
        run: python -m unittest discover -s tests -p 'test_translation_stage.py' -v
      - name: Verify isolated visual review ledger, idempotence, and SKIP LOCKED leases
        run: python -m unittest discover -s tests -p 'test_visual_task_ledger.py' -v
