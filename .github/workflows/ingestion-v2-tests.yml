name: Ingestion v2 isolated foundation tests
on:
  push:
    branches: [feat/ingestion-v2-foundation]
  pull_request:
    paths:
      - 'ingestion_v2/**'
      - 'scripts/check_gcp_quotas.py'
      - 'profiles/ingestion_v2_general.json'
      - 'profiles/document_pipeline_use_case.yml'
      - 'tests/test_ingestion_v2*.py'
      - '.github/workflows/ingestion-v2-tests.yml'

jobs:
  native-extraction-and-chunking:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install native PDF, tokenization and YAML packages
        run: python -m pip install --upgrade pip pymupdf "tiktoken>=0.7,<1" "PyYAML>=6.0.2,<7"
      - name: Python syntax checks
        run: python -m compileall -q ingestion_v2 scripts/check_gcp_quotas.py
      - name: Deterministic unit and real-PDF integration tests
        run: python -m unittest discover -s tests -p "test_ingestion_v2*.py" -v
