name: Real PDF retained capture and PostgreSQL throughput
on:
  push:
    branches: [feat/rich-document-multilingual-v2]
    paths:
      - tests/real_capture_db_benchmark.py
      - .github/workflows/real-capture-db.yml
  workflow_dispatch:
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: embedding_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d embedding_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: test
      PGDATABASE: embedding_test
      INGESTION_REUSE_TEST_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "PyMuPDF==1.28.2" "pdfplumber==0.11.10" "pdfminer.six==20260107" "pillow>=10,<13" "requests>=2.32,<3" "psycopg2-binary>=2.9,<3" "tiktoken>=0.7,<1" "PyYAML>=6,<7"
      - name: Disposable CI-only database config
        run: |
          cat > config.ini <<'EOF'
          [POSTGRES]
          host=localhost
          port=5432
          database=embedding_test
          user=postgres
          password=test
          schema=intake_ci
          folder=ci
          pool_enabled=true
          pool_min_connections=1
          pool_max_connections=5
          [GCP]
          gcp_key_path=not-used.json
          EOF
      - name: Full 6353-page retained capture and native-only publication
        timeout-minutes: 90
        run: python tests/real_capture_db_benchmark.py --workers 4 --materialize-workers 2 --report real_capture_db.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-capture-db-${{ github.run_id }}
          path: |
            real_capture_db.json
            real_capture_db.json.receipts.jsonl
          if-no-files-found: warn
          retention-days: 14
