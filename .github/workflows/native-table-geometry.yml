name: Experimental native table geometry prepass
on:
  push:
    branches: [feat/rich-document-multilingual-v2]
    paths:
      - tests/native_table_geometry_probe.py
      - tests/test_native_table_geometry_probe.py
      - .github/workflows/native-table-geometry.yml
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "PyMuPDF>=1.24,<2" "pdfplumber>=0.11,<1" "pillow>=10,<13" "requests>=2.32,<3"
      - name: CI-only config
        run: |
          cat > config.ini <<'EOF'
          [POSTGRES]
          host=localhost
          port=5432
          database=embedding_test
          user=postgres
          password=test
          schema=intake_ci
          folder=ci
          [GCP]
          gcp_key_path=not-used.json
          EOF
      - run: python -m unittest discover -s tests -p test_native_table_geometry_probe.py -v
      - run: python tests/native_table_geometry_probe.py --sample-pages 100 --report native_geometry.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-geometry-${{ github.run_id }}
          path: native_geometry.json
          if-no-files-found: warn
