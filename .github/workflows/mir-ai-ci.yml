name: MIR-AI CI

on:
  push:
    branches: ["feature/MIR-AI-2026-09-12"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: mirai_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mirai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MIRAI_PG_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-mirai.txt
      - run: python -m compileall -q mir_ai mir_ai_main.py
      - run: pytest -q
