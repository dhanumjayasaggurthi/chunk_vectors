name: EvidenceFlow scaffold CI
on:
  push:
    branches: ["feature/evidenceflow-enterprise"]
  pull_request:
    paths: ["evidenceflow_enterprise/**", ".github/workflows/evidenceflow-ci.yml"]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evidenceflow_enterprise
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Run tests
        run: python -m pytest -q
      - name: Compile source
        run: python -m compileall -q backend
