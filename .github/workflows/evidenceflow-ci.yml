name: EvidenceFlow scaffold CI
on:
  push:
    branches: ["feature/evidenceflow-enterprise"]
  pull_request:
    paths: ["backend/**", "tests/**", "scripts/**", "frontend/**", "migrations/**", "requirements*.txt", ".github/workflows/evidenceflow-ci.yml"]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Compile source
        run: python -m compileall -q backend
      - name: Check frontend JavaScript syntax
        run: node --check frontend/app.js
      - name: Validate five synthetic PDFs end-to-end
        run: python -m scripts.validate_sample_pdfs
      - name: Package runnable offline demo
        run: |
          tar -czf demo_output/evidenceflow-demo-source.tar.gz \
            --exclude='__pycache__' --exclude='*.pyc' \
            backend frontend scripts migrations README.md requirements.txt requirements-dev.txt alembic.ini
      - name: Upload sample PDFs and extracted CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidenceflow-pdf-validation
          path: demo_output/
          if-no-files-found: warn
