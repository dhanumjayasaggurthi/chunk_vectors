name: Profile validation
on:
  push:
    branches:
      - feature-configurable-processing-profiles
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal profile test requirements
        run: python -m pip install --disable-pip-version-check tiktoken psycopg2-binary
      - name: Supply non-secret unit-test config
        run: |
          cat > config.ini <<'INI'
          [POSTGRES]
          host = localhost
          port = 5432
          database = ci_only
          user = ci
          password = ci_only
          schema = epod_ci
          folder = test
          [GCP]
          gcp_key_path = dummy-key.json
          INI
      - name: Python syntax checks
        run: python -m compileall -q .
      - name: Profile regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
