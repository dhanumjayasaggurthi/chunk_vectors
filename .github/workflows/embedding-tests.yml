name: Embedding engine unit tests
on:
  push:
    branches: [feat/distributed-fast-embeddings]
  pull_request:
    paths:
      - 'fast_embedding_runtime.py'
      - 'embedding_dashboard.py'
      - 'embedding_dashboard_data.py'
      - 'embedding_dashboard_docs.py'
      - 'tests/test_embedding_dashboard_docs.py'
      - 'tests/test_embedding_dashboard_docs_integration.py'
      - 'tests/test_embedding_dashboard_data.py'
      - 'tests/test_fast_embedding_runtime.py'
      - '.github/workflows/embedding-tests.yml'
jobs:
  unit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: embedding_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d embedding_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: test
      PGDATABASE: embedding_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install psycopg2-binary requests tiktoken
      - run: python -m py_compile fast_embedding_runtime.py main.py processing_profile.py existing_embeddings.py embedding_dashboard.py embedding_dashboard_data.py embedding_dashboard_docs.py
      - run: python -m unittest discover -s tests -p 'test_fast_embedding_runtime*.py' -v
      - run: python -m unittest discover -s tests -p 'test_embedding_dashboard_data.py' -v
      - run: python -m unittest discover -s tests -p 'test_embedding_dashboard_docs*.py' -v
