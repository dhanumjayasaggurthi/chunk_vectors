name: Embedding engine unit tests
on:
  push:
    branches: [feat/distributed-fast-embeddings]
  pull_request:
    paths:
      - 'fast_embedding_runtime.py'
      - 'tests/test_fast_embedding_runtime.py'
      - '.github/workflows/embedding-tests.yml'
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install psycopg2-binary requests tiktoken
      - run: python -m py_compile fast_embedding_runtime.py main.py processing_profile.py existing_embeddings.py
      - run: python -m unittest discover -s tests -p 'test_fast_embedding_runtime.py' -v
