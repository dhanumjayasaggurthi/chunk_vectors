name: Full 100 authentic regulatory PDF volumes - distributed process benchmark

on:
  push:
    branches: [feat/rich-document-multilingual-v2]
    paths: [.github/workflows/real-100-volume-benchmark.yml]
  workflow_dispatch:

jobs:
  shard:
    name: CFR full extraction shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "PyMuPDF>=1.24,<2" "pdfplumber>=0.11,<1" "pillow>=10,<13" "requests>=2.32,<3"
      - name: Credential-free native extraction configuration
        run: |
          cat > config.ini <<'EOF'
          [POSTGRES]
          host=localhost
          port=5432
          database=embedding_test
          user=postgres
          password=test
          schema=intake_ci
          folder=ci
          [GCP]
          gcp_key_path=not-used.json
          EOF
      - name: Download 25 distinct official volumes and extract ALL pages
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python tests/online_public_regulatory_benchmark.py --documents 25 --min-pages 100 --max-pages 0 --max-candidates 179 --shard-index "$SHARD" --shard-count 4 --process-pool --workers 4 --download-workers 2 --batch-size 16 --report "real_regulatory_shard_${SHARD}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regulatory-shard-${{ matrix.shard }}
          path: real_regulatory_shard_*.json
          if-no-files-found: warn
          retention-days: 30

  validate-100:
    name: Verify 100 distinct complete source files and aggregate results
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: regulatory-shard-*
          path: reports
      - name: Require 100 full documents, valid SHA and zero native parsing errors
        run: |
          python tests/aggregate_public_regulatory_reports.py --reports reports --shards 4 --min-documents 100 --output full_100_regulatory_summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-100-regulatory-summary
          path: full_100_regulatory_summary.json
          retention-days: 30
